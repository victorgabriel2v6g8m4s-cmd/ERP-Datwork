name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Runtime diagnostics
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test frontend
        run: npm test

      - name: Typecheck shared frontend
        run: npm run typecheck:shared

      - name: Typecheck Recipes module
        run: npm run typecheck:recipes

      - name: Typecheck Pricing module
        run: npm run typecheck:pricing

      - name: Lint frontend
        run: npm run lint
        continue-on-error: true

      - name: Typecheck frontend
        id: frontend-typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Report TypeScript debt
        if: steps.frontend-typecheck.outcome == 'failure'
        run: echo '::warning::Full frontend TypeScript validation still contains legacy debt. Shared code, Recipes and Pricing are enforced separately.'

      - name: Build frontend bundle
        run: npm run build:bundle

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: file:./ci.db

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Runtime diagnostics
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Validate database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Test and build backend
        run: npm test

      - name: Upload backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: backend/dist
          if-no-files-found: error
          retention-days: 3
